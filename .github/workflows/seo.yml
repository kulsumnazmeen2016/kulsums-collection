# Builds search-engine pages for every product and collection, plus sitemap.xml, robots.txt and the Google Merchant Center feed.
# Runs every 3 hours, whenever index.html or config.js changes, and when you press "Run workflow".
name: Build SEO pages
on:
  schedule:
    - cron: "17 */3 * * *"
  workflow_dispatch:
  push:
    paths: ["index.html", "config.js", "scripts/build-seo.mjs"]
permissions:
  contents: write
concurrency:
  group: seo-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Build pages from the live catalogue
        run: node scripts/build-seo.mjs
      - name: Save the pages
        run: |
          git config user.name "kulsums-seo-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A products collections pages sitemap.xml robots.txt merchant-feed.tsv merchant-feed.xml 404.html offers.html stories.html videos.html news.html combos.html cart.html checkout.html wishlist.html track.html search.html emi.html hi.html
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Update SEO pages"
          git pull --rebase
          git push

     
